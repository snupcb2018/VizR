<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-M" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VizR: RNASeq Visualization Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              primary: {
                light: '#a5f3fc',
                DEFAULT: '#06b6d4',
                dark: '#0891b2',
              },
              secondary: '#f97316',
              light: '#f8fafc',
            },
            keyframes: {
              breathe: {
                '0%, 100%': { transform: 'scale(1)', opacity: '1', backgroundColor: '#cffafe' }, // cyan-100
                '12.5%':    { backgroundColor: '#d1fae5' }, // green-100
                '25%':      { backgroundColor: '#fef9c3' }, // yellow-100
                '37.5%':    { backgroundColor: '#ffedd5' }, // orange-100
                '50%':      { transform: 'scale(1.05)', opacity: '.8', backgroundColor: '#fee2e2' }, // red-100
                '62.5%':    { backgroundColor: '#f3e8ff' }, // purple-100
                '75%':      { backgroundColor: '#e0e7ff' }, // indigo-100
                '87.5%':    { backgroundColor: '#dbeafe' }, // blue-100
              }
            },
            animation: {
              breathe: 'breathe 8s ease-in-out infinite',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",
    "recharts": "https://esm.sh/recharts@^3.1.0",
    "d3": "https://esm.sh/d3@^7.9.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<link rel="stylesheet" href="/scrollbar.css">
</head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
